databases:
  - name: purakam-db
    databaseName: purakam
    user: admin
    plan: free

services:
  # 1. FastAPI Backend Service
  - type: web
    name: purakam-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.seed && uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: purakam-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.8

  # 2. Flask Frontend Service
  - type: web
    name: purakam-frontend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn frontend.app:app
    envVars:
      - key: BACKEND_API_URL
        fromService:
          type: web
          name: purakam-backend
          property: host
      - key: PYTHON_VERSION
        value: 3.10.8

