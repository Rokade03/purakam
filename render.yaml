databases:
  - name: purakam-db
    databaseName: purakam
    user: admin
    plan: free

services:
  # 1. FastAPI Backend Service
  - type: web
    name: purakam-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    preDeployCommand: python -m backend.seed
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: purakam-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.8

  # 2. Flask Frontend Service
  - type: web
    name: purakam-frontend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn frontend.app:app
    envVars:
      - key: BACKEND_API_URL
        # In Render, this service can query the backend using the internal host or external host.
        # Let's set it to the external URL. Note: If the name 'purakam-backend' is taken on Render,
        # Render will append a suffix (e.g. purakam-backend-1234). In that case, you can update
        # this variable in the Render Dashboard after the initial deploy.
        value: https://purakam-backend.onrender.com/api
      - key: PYTHON_VERSION
        value: 3.10.8
